name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly upstream-drift check: install latest pi, smoke-run pify against it.
    - cron: "0 6 * * 1"

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Smoke test CLI
        run: |
          node dist/cli.js --version
          node dist/cli.js list
          node dist/cli.js install --dry-run goal || true
          node dist/cli.js doctor || true

  upstream-drift:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install latest pi and smoke pify against it
        run: |
          node dist/cli.js setup
          node dist/cli.js doctor
          node dist/cli.js update --dry-run
